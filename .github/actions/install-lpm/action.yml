name: "Install LPM"
description: "Installs LPM for the current runner's OS"
runs:
  using: "composite"
  steps:
    - name: Install LPM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -f -L "https://github.com/luaupm/lpm/releases/download/v0.5.2/lpm-linux-x86_64.zip" -o lpm.zip
        unzip -j lpm.zip
        chmod +x lpm
        sudo mv lpm /usr/local/bin/lpm
        rm lpm.zip
        lpm self install
        echo "$HOME/.lpm/bin" >> $GITHUB_PATH

    - name: Install LPM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        curl -f -L "https://github.com/luaupm/lpm/releases/download/v0.5.2/lpm-macos-x86_64.zip" -o lpm.zip
        unzip -j lpm.zip
        chmod +x lpm
        sudo mv lpm /usr/local/bin/lpm
        rm lpm.zip
        lpm self install
        echo "$HOME/.lpm/bin" >> $GITHUB_PATH

    - name: Install LPM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/luaupm/lpm/releases/download/v0.5.2/lpm-windows-x86_64.zip" -OutFile lpm.zip
        Expand-Archive -Path lpm.zip -DestinationPath lpm_extracted -Force
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.lpm\bin" | Out-Null
        Move-Item -Force lpm_extracted\lpm.exe "$env:USERPROFILE\.lpm\bin\lpm.exe"
        Remove-Item lpm.zip, lpm_extracted -Recurse -Force
        & "$env:USERPROFILE\.lpm\bin\lpm.exe" self install
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.lpm\bin"